        uses: actions/github-script@v6
        with:
          script: |
            const branch = 'atlas-init';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Helper to create branch from main if it does not exist
            async function ensureBranch() {
              try {
                const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch });
                core.info(`Branch ${branch} already exists: ${ref.data.object.sha}`);
                return;
              } catch (e) {
                core.info(`Creating branch ${branch} from main`);
                const mainRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
                const sha = mainRef.data.object.sha;
                await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/' + branch, sha });
              }
            }

            // Files to create in atlas-init (paths -> contents)
            const files = {
              "atlas/__init__.py": `# Atlas package init
`,
              "atlas/journal.py": `\"\"\"Atlas — autonomous AI research journal core logic

Conservative, safe defaults:
- Web search disabled until SEARCH_API_KEY and SEARCH_API_ENDPOINT are set in the environment or GitHub secrets.
- Model generation uses a lightweight stub until LLM_API_KEY is provided. The adapter is pluggable.
- Append-only entries. In-place amendments can be written to an \"amendments\" section inside a new entry.
- Memory is a simple JSON store at memory.json.

See README.md for usage and how to configure secrets.
\"\"\"
import os
import json
import glob
import datetime
from typing import List, Dict, Any

MEMORY_PATH = os.getenv('ATLAS_MEMORY_PATH', 'memory.json')
ENTRIES_DIR = os.getenv('ATLAS_ENTRIES_DIR', 'entries')
MAX_ENTRIES_TO_LOAD = int(os.getenv('ATLAS_MAX_ENTRIES', '20'))

def load_entries(limit: int = MAX_ENTRIES_TO_LOAD) -> List[str]:
    paths = sorted(glob.glob(os.path.join(ENTRIES_DIR, '*.md')))
    selected = paths[-limit:]
    entries = []
    for p in selected:
        try:
            with open(p, 'r', encoding='utf-8') as f:
                entries.append(f.read())
        except Exception:
            continue
    return entries

def load_memory() -> Dict[str, Any]:
    if not os.path.exists(MEMORY_PATH):
        return {\"topics\": {}, \"last_run\": None}
    try:
        with open(MEMORY_PATH, 'r', encoding='utf-8') as f:
            return json.load(f)
    except Exception:
        return {\"topics\": {}, \"last_run\": None}

def save_memory(mem: Dict[str, Any]):
    os.makedirs(os.path.dirname(MEMORY_PATH) or '.', exist_ok=True)
    with open(MEMORY_PATH, 'w', encoding='utf-8') as f:
        json.dump(mem, f, indent=2, ensure_ascii=False)

import requests

def web_search(query: str, max_results: int = 3):
    key = os.getenv('SEARCH_API_KEY')
    endpoint = os.getenv('SEARCH_API_ENDPOINT')
    if not key or not endpoint:
        return []
    headers = {'Ocp-Apim-Subscription-Key': key}
    params = { 'q': query, 'count': max_results }
    try:
        resp = requests.get(endpoint, params=params, headers=headers, timeout=10)
        resp.raise_for_status()
        data = resp.json()
    except Exception:
        return []
    results = []
    if isinstance(data.get('webPages'), dict):
        for item in data['webPages'].get('value', []):
            results.append({'title': item.get('name'),'snippet': item.get('snippet'),'url': item.get('url')})
    elif isinstance(data.get('items'), list):
        for item in data.get('items', []):
            results.append({'title': item.get('title'),'snippet': item.get('snippet') or item.get('snippetText'),'url': item.get('link') or item.get('url')})
    return results

import re
def extract_queries(entries: List[str], memory: Dict[str, Any], max_queries: int = 3) -> List[str]:
    queries = []
    for t in memory.get('topics', {}).keys():
        queries.append(t)
        if len(queries) >= max_queries:
            return queries
    words = []
    for e in entries[-5:]:
        for m in re.findall(r\"^#{1,3}\\s*(.+)$\", e, flags=re.MULTILINE):
            words.append(m.strip())
        for m in re.findall(r\"\\b([A-Z][a-z]{2,}(?:\\s+[A-Z][a-z]{2,})*)\\b\", e):
            words.append(m)
    for w in words:
        if w not in queries:
            queries.append(w)
        if len(queries) >= max_queries:
            break
    return queries

